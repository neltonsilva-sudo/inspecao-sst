<!doctype html>
<html lang="pt-BR" style="color-scheme:light"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inspeção SST por Câmera</title>
<style>html,body{margin:0;height:100%;background:#eef1f3}</style>
<script>/* carregador: o link é sempre o mesmo e busca sempre a versão mais nova do sistema (sem cópia antiga do cache) */
(function(){var f=function(){location.replace('app.html'+location.search);};
try{fetch('app.html?nc='+Date.now(),{cache:'no-store',credentials:'omit'}).then(function(r){if(!r.ok)throw 0;return r.text();})
.then(function(t){document.open();document.write(t);document.close();}).catch(f);}catch(e){f();}})();
</script></head><body></body></html>
